name: Binance Strategy 27 Events

on:
  pull_request:
    paths:
      - ".github/workflows/binance-strategy27-events.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-userscript.mjs"
      - "scripts/userscript-release-contract.mjs"
      - "src/binance-strategy27-events/**"
      - "src/shared/binance-futures-route.js"
      - "src/shared/spa-route-change.js"
      - "scripts/binance-strategy27-events.user.js"
      - "test/unit/binance-strategy27-events/**"
      - "test/dom/binance-strategy27-events/**"
      - "test/unit/userscript-metadata-icons.test.js"
      - "test/unit/userscript-release-contract.test.js"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/binance-strategy27-events.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-userscript.mjs"
      - "scripts/userscript-release-contract.mjs"
      - "src/binance-strategy27-events/**"
      - "src/shared/binance-futures-route.js"
      - "src/shared/spa-route-change.js"
      - "scripts/binance-strategy27-events.user.js"
      - "test/unit/binance-strategy27-events/**"
      - "test/dom/binance-strategy27-events/**"
      - "test/unit/userscript-metadata-icons.test.js"
      - "test/unit/userscript-release-contract.test.js"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:binance-strategy27-events
      - run: npm run build:binance-strategy27-events
      - run: git diff --exit-code -- scripts/binance-strategy27-events.user.js
      - run: npm run check:binance-userscripts
      - run: node scripts/userscript-release-contract.mjs scripts/binance-strategy27-events.user.js

